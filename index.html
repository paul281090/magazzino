<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gestione Magazzino</title>
<style>
:root{
  --bg:#F6F3EC; --panel:#FFFFFF; --ink:#242220; --muted:#7A7468;
  --line:#DED6C4; --green:#3C5B45; --green-dark:#2B4232; --amber:#C08A3E;
  --danger:#A6412F; --radius:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1C1B18; --panel:#252420; --ink:#EDE8DD; --muted:#A79E8C;
    --line:#3A362E; --green:#6E9A79; --green-dark:#88B393; --amber:#D9A65C;
  }
}
:root[data-theme="dark"]{
  --bg:#1C1B18; --panel:#252420; --ink:#EDE8DD; --muted:#A79E8C;
  --line:#3A362E; --green:#6E9A79; --green-dark:#88B393; --amber:#D9A65C;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  min-height:100%;
}
.wrap{max-width:980px;margin:0 auto;padding:28px 18px 60px;}
header{margin-bottom:22px;border-bottom:2px solid var(--green);padding-bottom:14px;}
header h1{font-size:1.7rem;margin:0 0 4px;letter-spacing:-.01em;}
header p{margin:0;color:var(--muted);font-size:.92rem;}

.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{
  flex:1;min-width:140px;padding:12px 14px;border-radius:var(--radius);border:1px solid var(--line);
  background:var(--panel);color:var(--ink);font-size:.95rem;font-weight:600;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;
}
.tab-btn.active{background:var(--green);border-color:var(--green);color:#fff;}
.tab-btn:not(.active):hover{border-color:var(--green);}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:22px;display:none;}
.panel.active{display:block;}
.panel h2{margin:0 0 14px;font-size:1.05rem;}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
label{display:block;font-size:.78rem;color:var(--muted);margin-bottom:4px;}
input,select{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--ink);font-size:.92rem;
}
input:focus,select:focus{outline:2px solid var(--green);outline-offset:1px;}

.btn{
  margin-top:14px;padding:10px 18px;border:none;border-radius:8px;background:var(--green);
  color:#fff;font-weight:600;font-size:.9rem;cursor:pointer;
}
.btn:hover{background:var(--green-dark);}
.btn.danger{background:var(--danger);}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.msg{margin-top:10px;font-size:.85rem;}
.msg.ok{color:var(--green);}
.msg.err{color:var(--danger);}

.table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);}
table{border-collapse:collapse;width:100%;min-width:640px;font-size:.87rem;}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;}
th{background:var(--bg);color:var(--muted);font-weight:600;font-size:.75rem;text-transform:uppercase;letter-spacing:.03em;}
tbody tr:hover{background:var(--bg);}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--amber);color:#2A2011;font-size:.72rem;font-weight:700;}
.empty-row td{color:var(--muted);text-align:center;padding:26px;}
.count{color:var(--muted);font-size:.82rem;margin:10px 2px 0;}
.del-btn{background:none;border:none;color:var(--danger);cursor:pointer;font-size:.9rem;}

.table-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap;}
.table-toolbar input{flex:1;min-width:180px;}
.print-btn{
  padding:9px 16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
  color:var(--ink);font-size:.85rem;font-weight:600;cursor:pointer;white-space:nowrap;
}
.print-btn:hover{border-color:var(--green);color:var(--green);}
th.sortable{cursor:pointer;user-select:none;}
th.sortable:hover{color:var(--ink);}
th.sortable .arrow{opacity:.35;margin-left:4px;font-size:.7em;}
th.sortable.sort-asc .arrow,th.sortable.sort-desc .arrow{opacity:1;color:var(--green);}

@media print{
  body{background:#fff;}
  header,.tabs,.panel,.table-toolbar,.count,.del-btn,.print-btn{display:none !important;}
  .wrap{max-width:100%;padding:0;}
  .table-wrap{border:none;}
  th,td{white-space:normal;}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Gestione Magazzino</h1>
    <p>Carico, scarico e ricerca delle forme — colonne: Scalera, Matricola, Mese/Anno, Forme, Note, Tipologia</p>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="carico">＋ Carico merce</button>
    <button class="tab-btn" data-tab="scarico">－ Scarico merce</button>
    <button class="tab-btn" data-tab="filtri">🔍 Filtri di ricerca</button>
  </div>

  <!-- CARICO -->
  <div class="panel active" id="panel-carico">
    <h2>Carica nuova merce in inventario</h2>
    <div class="grid">
      <div><label>Scalera</label><input id="c-scalera" type="number" placeholder="es. 1"></div>
      <div><label>Matricola</label><input id="c-matricola" type="number" placeholder="es. 703"></div>
      <div><label>Mese/Anno</label><input id="c-mese" type="month"></div>
      <div><label>Forme</label><input id="c-forme" type="number" min="0" placeholder="es. 30"></div>
      <div><label>Tipologia</label><input id="c-tipologia" list="tip-list" placeholder="es. BIO"></div>
      <div style="grid-column:1/-1"><label>Note</label><input id="c-note" type="text" placeholder="facoltativo"></div>
    </div>
    <datalist id="tip-list"></datalist>
    <button class="btn" onclick="caricaMerce()">Carica in inventario</button>
    <div class="msg" id="c-msg"></div>
  </div>

  <!-- SCARICO -->
  <div class="panel" id="panel-scarico">
    <h2>Scarica merce dall'inventario (anche parziale)</h2>
    <div class="grid">
      <div style="grid-column:1/-1"><label>Riga da scaricare</label><select id="s-select"></select></div>
      <div><label>Forme da scaricare</label><input id="s-forme" type="number" min="1" placeholder="quantità"></div>
    </div>
    <button class="btn" onclick="scaricaMerce()">Scarica quantità indicata</button>
    <button class="btn ghost" onclick="scaricaTutto()">Scarica tutto (rimuovi riga)</button>
    <div class="msg" id="s-msg"></div>
  </div>

  <!-- FILTRI -->
  <div class="panel" id="panel-filtri">
    <h2>Filtri di ricerca</h2>
    <div class="grid">
      <div><label>Scalera</label><input id="f-scalera" type="number" oninput="applyFilters()"></div>
      <div><label>Matricola</label><input id="f-matricola" type="number" oninput="applyFilters()"></div>
      <div><label>Tipologia</label><select id="f-tipologia" onchange="applyFilters()"><option value="">Tutte</option></select></div>
      <div><label>Mese/Anno da</label><input id="f-mese-da" type="month" oninput="applyFilters()"></div>
      <div><label>Mese/Anno a</label><input id="f-mese-a" type="month" oninput="applyFilters()"></div>
      <div><label>Testo (note)</label><input id="f-testo" type="text" oninput="applyFilters()" placeholder="cerca nelle note"></div>
    </div>
    <button class="btn ghost" onclick="resetFilters()">Azzera filtri</button>
  </div>

  <div class="table-toolbar">
    <input id="q-search" type="text" placeholder="Cerca un valore in tutta la tabella…" oninput="applyFilters()">
    <button class="print-btn" onclick="window.print()">🖨️ Stampa tabella</button>
  </div>
  <div class="table-wrap">
    <table>
      <thead><tr id="thead-row">
        <th class="sortable" data-col="scalera">Scalera<span class="arrow">▲▼</span></th>
        <th class="sortable" data-col="matricola">Matricola<span class="arrow">▲▼</span></th>
        <th class="sortable" data-col="mese">Mese/Anno<span class="arrow">▲▼</span></th>
        <th class="sortable" data-col="forme">Forme<span class="arrow">▲▼</span></th>
        <th class="sortable" data-col="tipologia">Tipologia<span class="arrow">▲▼</span></th>
        <th class="sortable" data-col="note">Note<span class="arrow">▲▼</span></th>
        <th></th>
      </tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
  <div class="count" id="count"></div>
</div>

<script>
let DATA = [];
try{ DATA = JSON.parse(localStorage.getItem('magazzino_data') || '[]'); }catch(e){ DATA = []; }

function save(){
  try{ localStorage.setItem('magazzino_data', JSON.stringify(DATA)); }catch(e){}
}

function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active', p.id==='panel-'+tab));
  if(tab==='scarico') populateScaricoSelect();
}
document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));

function fmtMese(v){
  if(!v) return '—';
  const [y,m]=v.split('-');
  return m+'/'+y;
}

function caricaMerce(){
  const scalera=document.getElementById('c-scalera').value;
  const matricola=document.getElementById('c-matricola').value;
  const mese=document.getElementById('c-mese').value;
  const forme=parseFloat(document.getElementById('c-forme').value);
  const tipologia=document.getElementById('c-tipologia').value.trim();
  const note=document.getElementById('c-note').value.trim();
  const msg=document.getElementById('c-msg');

  if(!scalera || !matricola || !mese || !forme || forme<=0){
    msg.textContent='Compila scalera, matricola, mese/anno e un numero di forme valido.';
    msg.className='msg err'; return;
  }
  DATA.push({
    id: Date.now()+'-'+Math.random().toString(36).slice(2,7),
    scalera:Number(scalera), matricola:Number(matricola), mese, forme:Number(forme), tipologia, note
  });
  save();
  msg.textContent='Merce caricata in inventario.'; msg.className='msg ok';
  document.getElementById('c-scalera').value='';
  document.getElementById('c-matricola').value='';
  document.getElementById('c-mese').value='';
  document.getElementById('c-forme').value='';
  document.getElementById('c-tipologia').value='';
  document.getElementById('c-note').value='';
  refreshAll();
}

function populateScaricoSelect(){
  const sel=document.getElementById('s-select');
  sel.innerHTML='';
  if(DATA.length===0){
    sel.innerHTML='<option value="">Nessuna riga in inventario</option>';
    return;
  }
  DATA.forEach(r=>{
    const opt=document.createElement('option');
    opt.value=r.id;
    opt.textContent=`Scalera ${r.scalera} · Matricola ${r.matricola} · ${fmtMese(r.mese)} · ${r.forme} forme${r.tipologia?' · '+r.tipologia:''}`;
    sel.appendChild(opt);
  });
}

function scaricaMerce(){
  const id=document.getElementById('s-select').value;
  const qty=parseFloat(document.getElementById('s-forme').value);
  const msg=document.getElementById('s-msg');
  const rec=DATA.find(r=>r.id===id);
  if(!rec){ msg.textContent='Seleziona una riga valida.'; msg.className='msg err'; return; }
  if(!qty || qty<=0){ msg.textContent='Inserisci una quantità valida.'; msg.className='msg err'; return; }
  if(qty>rec.forme){ msg.textContent=`Quantità superiore alle forme disponibili (${rec.forme}).`; msg.className='msg err'; return; }
  rec.forme -= qty;
  if(rec.forme===0) DATA=DATA.filter(r=>r.id!==id);
  save();
  msg.textContent='Scarico registrato.'; msg.className='msg ok';
  document.getElementById('s-forme').value='';
  populateScaricoSelect();
  refreshAll();
}

function scaricaTutto(){
  const id=document.getElementById('s-select').value;
  if(!id) return;
  DATA=DATA.filter(r=>r.id!==id);
  save();
  document.getElementById('s-msg').textContent='Riga rimossa dall\'inventario.';
  document.getElementById('s-msg').className='msg ok';
  populateScaricoSelect();
  refreshAll();
}

function deleteRow(id){
  DATA=DATA.filter(r=>r.id!==id);
  save();
  refreshAll();
}

function populateTipologiaOptions(){
  const sel=document.getElementById('f-tipologia');
  const dl=document.getElementById('tip-list');
  const current=sel.value;
  const types=[...new Set(DATA.map(r=>r.tipologia).filter(Boolean))].sort();
  sel.innerHTML='<option value="">Tutte</option>'+types.map(t=>`<option value="${t}">${t}</option>`).join('');
  sel.value=current;
  dl.innerHTML=types.map(t=>`<option value="${t}">`).join('');
}

function resetFilters(){
  ['f-scalera','f-matricola','f-mese-da','f-mese-a','f-testo'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('f-tipologia').value='';
  applyFilters();
}

let sortState={col:null, dir:1};

function toggleSort(col){
  if(sortState.col===col){ sortState.dir*=-1; }
  else{ sortState.col=col; sortState.dir=1; }
  document.querySelectorAll('th.sortable').forEach(th=>{
    th.classList.remove('sort-asc','sort-desc');
    if(th.dataset.col===sortState.col) th.classList.add(sortState.dir===1?'sort-asc':'sort-desc');
  });
  applyFilters();
}
document.querySelectorAll('th.sortable').forEach(th=>th.addEventListener('click',()=>toggleSort(th.dataset.col)));

function sortRows(rows){
  if(!sortState.col) return rows;
  const col=sortState.col, dir=sortState.dir;
  const numeric=(col==='scalera'||col==='matricola'||col==='forme');
  return [...rows].sort((a,b)=>{
    let va=a[col], vb=b[col];
    if(numeric){ va=Number(va)||0; vb=Number(vb)||0; }
    else{ va=(va||'').toString().toLowerCase(); vb=(vb||'').toString().toLowerCase(); }
    if(va<vb) return -1*dir;
    if(va>vb) return 1*dir;
    return 0;
  });
}

function applyFilters(){
  const scalera=document.getElementById('f-scalera').value;
  const matricola=document.getElementById('f-matricola').value;
  const tipologia=document.getElementById('f-tipologia').value;
  const meseDa=document.getElementById('f-mese-da').value;
  const meseA=document.getElementById('f-mese-a').value;
  const testo=document.getElementById('f-testo').value.trim().toLowerCase();
  const quick=document.getElementById('q-search').value.trim().toLowerCase();

  let filtered=DATA.filter(r=>{
    if(scalera && String(r.scalera)!==String(scalera)) return false;
    if(matricola && String(r.matricola)!==String(matricola)) return false;
    if(tipologia && r.tipologia!==tipologia) return false;
    if(meseDa && r.mese && r.mese<meseDa) return false;
    if(meseA && r.mese && r.mese>meseA) return false;
    if(testo && !(r.note||'').toLowerCase().includes(testo)) return false;
    if(quick){
      const hay=[r.scalera,r.matricola,fmtMese(r.mese),r.forme,r.tipologia,r.note].join(' ').toLowerCase();
      if(!hay.includes(quick)) return false;
    }
    return true;
  });
  renderTable(sortRows(filtered));
}

function renderTable(rows){
  const tbody=document.getElementById('tbody');
  const count=document.getElementById('count');
  if(rows.length===0){
    tbody.innerHTML='<tr class="empty-row"><td colspan="7">Nessuna riga in inventario. Usa "Carico merce" per aggiungerne una.</td></tr>';
  }else{
    tbody.innerHTML=rows.map(r=>`
      <tr>
        <td>${r.scalera}</td>
        <td>${r.matricola}</td>
        <td>${fmtMese(r.mese)}</td>
        <td>${r.forme}</td>
        <td>${r.tipologia?`<span class="badge">${r.tipologia}</span>`:'—'}</td>
        <td>${r.note?r.note:'—'}</td>
        <td><button class="del-btn" onclick="deleteRow('${r.id}')" title="Elimina riga">✕</button></td>
      </tr>`).join('');
  }
  const totForme=rows.reduce((s,r)=>s+r.forme,0);
  count.textContent=`${rows.length} righe · ${totForme} forme totali`;
}

function refreshAll(){
  populateTipologiaOptions();
  applyFilters();
}

refreshAll();
</script>
</body>
</html>
